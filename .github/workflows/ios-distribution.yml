name: iOS Firebase Distribution

on:
  push:
    branches:
      - dev

jobs:
  build-and-distribute:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Create Env File
        run: |
          mkdir -p environments
          echo "${{ secrets.ENV_FILE_DEV }}" > environments/.env.dev

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Build iOS App
        uses: yukiarrr/ios-build-action@v1.9.1
        with:
          project-path: ios/BoilerPlate.xcodeproj
          p12-base64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          mobileprovision-base64: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          code-signing-identity: "iPhone Distribution"
          team-id: ${{ secrets.APPLE_TEAM_ID }}
          workspace-path: ios/BoilerPlate.xcworkspace
          scheme: BoilerPlate
          configuration: Release
          export-method: ad-hoc

      - name: Upload to Firebase
        run: |
          npm install -g firebase-tools
          firebase appdistribution:distribute \
          output.ipa \
          --app ${{ secrets.FIREBASE_APP_ID_IOS }} \
          --groups "QA" \
          --release-notes "Dev build - ${{ github.sha }}"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
