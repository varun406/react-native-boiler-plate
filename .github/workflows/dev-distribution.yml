name: Dev Firebase Distribution

on:
  push:
    branches:
      - dev

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2️⃣ Setup Node
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 3️⃣ Install dependencies (strict mode)
      - name: Install Dependencies
        run: npm install

      # 4️⃣ Setup Java for Android
      - name: Setup Java (Android)
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: 17

      # 5️⃣ Install Firebase CLI
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # 6️⃣ Clean + Build Debug APK
      - name: Clean and Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug

      # 7️⃣ Upload to Firebase App Distribution
      - name: Upload to Firebase
        run: |
          firebase appdistribution:distribute \
          android/app/build/outputs/apk/debug/app-debug.apk \
          --app ${{ secrets.FIREBASE_APP_ID_ANDROID }} \
          --groups "QA" \
          --release-notes "Dev build - ${{ github.sha }}"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
