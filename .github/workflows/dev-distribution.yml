name: Dev Firebase Distribution

on:
  push:
    branches:
      - dev

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Setup Java (Android)
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: 17

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Create .env.dev file
        run: |
          mkdir -p environments
          echo "${{ secrets.ENV_FILE_DEV }}" > environments/.env.dev

      - name: Build Debug APK
        run: npm run dev:android-build

      - name: Upload to Firebase
        run: |
          firebase appdistribution:distribute \
          android/app/build/outputs/apk/dev/release/app-release.apk \
          --app ${{ secrets.FIREBASE_APP_ID_ANDROID }} \
          --groups "QA" \
          --release-notes "Dev build - ${{ github.sha }}"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
